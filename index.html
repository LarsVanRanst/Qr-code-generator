<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR code generator</title>
<meta name="description" content="Make a QR code from text or a link and save it as PNG or JPG.">
<style>
  :root { --bg:#fff; --ink:#111; --muted:#666; --line:#111; --soft:#eee; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151515; --ink:#f1f1f1; --muted:#999; --line:#f1f1f1; --soft:#262626; }
  }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body {
    margin:0; background:var(--bg); color:var(--ink);
    font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    padding:32px 20px 60px;
  }
  .wrap { max-width:820px; margin:0 auto; }
  h1 { font-size:1.5rem; margin:0 0 4px; font-weight:700; }
  .sub { color:var(--muted); margin:0 0 28px; }
  .cols { display:flex; gap:32px; flex-wrap:wrap; align-items:flex-start; }
  .left { flex:1 1 320px; min-width:0; }
  .right { flex:0 0 300px; max-width:100%; }
  label { display:block; font-weight:600; margin:0 0 4px; }
  textarea, select {
    width:100%; font:inherit; color:var(--ink); background:var(--bg);
    border:2px solid var(--line); border-radius:3px; padding:8px 10px;
  }
  textarea { min-height:120px; resize:vertical; }
  textarea:focus, select:focus, button:focus-visible, input:focus-visible, a:focus-visible { outline:3px solid #f5b800; outline-offset:1px; }
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var pageUrl = location.origin + location.pathname;

  // Viewer mode: someone scanned a code and opened this page with the text in the address.
  var m = location.hash.match(/^#t=(.*)$/);
  if (m) {
    var decoded = '';
    try { decoded = decodeURIComponent(m[1]); } catch (e) { decoded = m[1]; }
    $('shown').textContent = decoded;
    $('back').href = location.pathname;
    $('viewer').hidden = false;
    $('app').hidden = true;
    document.title = 'Scanned text';
    return;
  }

  var text = $('text'), size = $('size'), ec = $('ec'), fg = $('fg'), bg = $('bg'), show = $('show');
  var canvas = $('canvas'), empty = $('empty'), msg = $('msg'), ecnote = $('ecnote'), shownote = $('shownote');
  var pngBtn = $('png'), jpgBtn = $('jpg');
  var ready = false;

  var notes = {
    L: 'Smallest code. Fine on screens, but a scratch or smudge can break it.',
    M: 'Good default for most uses.',
    Q: 'Still scans with some damage. Code gets denser.',
    H: 'Survives about 30% damage, or a small logo on top. Densest code.'
  };

  if (window.qrcode && qrcode.stringToBytesFuncs && qrcode.stringToBytesFuncs['UTF-8']) {
    qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];
  }

          if (qr.isDark(r, c)) ctx.fillRect((c + quiet) * scale, (r + quiet) * scale, scale, scale);
      setState(true, 'Image size: ' + px + ' × ' + px + ' px');
    } catch (e) {
      setState(false, 'Too much text for one QR code. Shorten it or lower the error correction.', true);
    }
  }

  function download(type, ext) {
    if (!ready) return;
    canvas.toBlob(function (blob) {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'qr-code.' + ext;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    }, type, 0.95);
  }

  [text, size, ec, fg, bg, show].forEach(function (el) {
    el.addEventListener('input', render);
    el.addEventListener('change', render);
  });
  pngBtn.addEventListener('click', function () { download('image/png', 'png'); });
  jpgBtn.addEventListener('click', function () { download('image/jpeg', 'jpg'); });
  render();
})();
</script>
</body>
</html>
